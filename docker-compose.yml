x-go-service: &go-service
  build:
    context: .
    dockerfile: infra/docker/go.Dockerfile
  restart: unless-stopped

x-db-env: &db-env
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --------------------------------------------------------------------------
  # Application services (canonical ports; identical inside and outside)
  # --------------------------------------------------------------------------

  achievement:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
      args: { SERVICE_NAME: achievement }
    ports: ["8083:8083"]
    environment:
      <<: *db-env
      PORT: "8083"
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  missions:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
      args: { SERVICE_NAME: missions }
    ports: ["8084:8084"]
    environment:
      <<: *db-env
      PORT: "8084"
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  auth:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
      args: { SERVICE_NAME: auth }
    ports: ["8085:8085"]
    environment:
      <<: *db-env
      PORT: "8085"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
