name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (live backend config via dart-define at deploy time)
        run: flutter build web --release

      - name: Build web (demo mode)
        run: flutter build web --release --dart-define=DEMO_MODE=true
